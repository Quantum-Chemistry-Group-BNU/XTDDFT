[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xtddft"
version = "0.1.0"
description = "Spin-adapted time-dependent density functional theory for open-shell systems"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
  { name = "XTDDFT developers" },
]
dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "pyscf",
  "h5py",
  "joblib",
  "opt_einsum",
  "psutil",
  "spglib",
  # libmsym-dependent symmetry features are available on Linux only.
  "libmsym; platform_system == 'Linux' or platform_system == 'Windows'",
  "sympy",
]

[project.optional-dependencies]
test = [
  "pytest",
]
gpu = [
  "cupy",
  "gpu4pyscf",
]
gpu-cuda11x = [
  "cupy-cuda11x",
  "gpu4pyscf",
]
gpu-cuda12x = [
  "cupy-cuda12x",
  "gpu4pyscf",
]

[tool.setuptools]
include-package-data = true
packages = ["XTDDFT", "XTDDFT.XTDDFT", "XTDDFT.XTDDFT.soc", "XTDDFT.utils", "XTDDFT.experiment", "XTDDFT.XTDDFT.grad", "XTDDFT.XTDDFT.nac"]

[tool.setuptools.package-dir]
"XTDDFT" = "."
"XTDDFT.XTDDFT" = "XTDDFT"
"XTDDFT.utils" = "utils"
"XTDDFT.experiment" = "experiment"

[tool.pytest.ini_options]
markers = [
  "slow: numerical finite-difference tests",
  "gpu: requires CuPy, GPU4PySCF, and a working CUDA device",
]
